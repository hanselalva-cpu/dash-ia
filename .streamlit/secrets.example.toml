# Plantilla de "Secrets" para Streamlit Community Cloud (App settings → Secrets). NO subir valores reales.
# Streamlit Cloud expone estas claves de primer nivel como variables de entorno, que lee config/settings.py.
# El dashboard solo necesita Supabase: las keys de OpenAI/Deepgram/ElevenLabs las usa la sincronización,
# que corre en la PC (tarea programada), así que NO van aquí.

SUPABASE_URL = "https://xxxx.supabase.co"
SUPABASE_SECRET_KEY = "sb_secret_..."
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_..."

DEMO_MODE = "false"
APP_TIMEZONE = "America/Mexico_City"
DEFAULT_DISPLAY_CURRENCY = "MXN"
USD_MXN_RATE = "18.50"

# Opcional: segunda barrera además de la lista de correos de Streamlit Cloud.
APP_PASSWORD = ""
